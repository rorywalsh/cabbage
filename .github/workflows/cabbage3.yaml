name: cabbage3-build

#Current Csound7 release...
env:
  CSOUND_TAG: "7.0.0"


on:
  push:
    branches:
      - main
      - develop

jobs:
  macos_build:
    name: MacOS build
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v1
        with:
          fetch-depth: 1
          submodules: true

      - name: Download CsoundLib64 Package
        run: |
          # Download the package using curl
          curl -L -o csound-7.zip "https://github.com/csound/csound/releases/download/${{ env.CSOUND_TAG }}/csound-macos-${{ env.CSOUND_TAG }}.zip"
          
          # Extract the zip file
          unzip -o csound-7.zip -d csound-7

          # Find the .pkg file (handles future name changes)
          PKG=$(find csound-7 -name "*.pkg" | head -n 1)
          echo "Found pkg: $PKG"

          # Make the downloaded file executable
          chmod +x "$PKG"

          # Install the package
          sudo installer -pkg "$PKG" -target /


      # - name: Set up Xcode path
      #   run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Configure CMake (tests only)
        run: |
          git clone https://github.com/rorywalsh/vscabbage.git
          cd vscabbage
          git checkout develop
          git pull
          pwd
          cd ..

          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          # Get absolute paths to compilers
          CC_PATH=$(which clang)
          CXX_PATH=$(which clang++)

          cmake -GXcode -B build \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
          -DCMAKE_C_COMPILER=$CC_PATH \
          -DCMAKE_CXX_COMPILER=$CXX_PATH \
          -DCMAKE_OBJC_COMPILER=$CC_PATH \
          -DCMAKE_OBJCXX_COMPILER=$CXX_PATH \
          -DCABBAGE_BUILD_TARGET=CabbageTests \
          -DTEST_VSCABBAGE_DIR="$(pwd)/vscabbage/src"

      - name: Build tests
        run: cmake --build build --config Debug

      - name: Run unit tests
        # Each Catch2 TEST_CASE is its own ctest test (see
        # catch_discover_tests in CMakeLists): progress streams per case and
        # --timeout turns a hung case into a reported Timeout while the rest
        # still run.
        timeout-minutes: 15
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 180

      - name: Rerun suite under lldb for a symbolicated backtrace
        # Runs only when the suite above fails. Zero cost on green runs.
        # The tests build uses the Debug config so the trace has line numbers.
        if: failure()
        timeout-minutes: 10
        run: |
          EXE=$(find build -name CabbageTests -type f | head -n 1)
          if [ -z "$EXE" ]; then echo "Test binary not found, skipping backtrace"; exit 0; fi
          echo "Rerunning $EXE under lldb..."
          lldb --batch -o run -o "bt 30" -o "thread list" -- "$EXE" 2>&1 | tail -60

      - name: Clean build folder
        run: rm -rf build

      - name: Configure and build
        run: |
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          # Get absolute paths to compilers
          CC_PATH=$(which clang)
          CXX_PATH=$(which clang++)

          cmake -GXcode -B build \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
          -DCMAKE_C_COMPILER=$CC_PATH \
          -DCMAKE_CXX_COMPILER=$CXX_PATH \
          -DCMAKE_OBJC_COMPILER=$CC_PATH \
          -DCMAKE_OBJCXX_COMPILER=$CXX_PATH \
          -DBUILD_ALL_TARGETS=True \
          -DCMAKE_BUILD_TYPE=Release

      - name: List build directory
        run: ls -l build

      - name: Zip the macOS app bundle
        run: |
          cd build
          ls 
          zip -r CabbageBundle.zip \
            CabbagePluginSynth/CabbagePluginSynth_assets/Release/CabbagePluginSynth.vst3 \
            CabbagePluginEffect/CabbagePluginEffect_assets/Release/CabbagePluginEffect.vst3 \
            CabbagePluginSynthARA/CabbagePluginSynthARA_assets/Release/CabbagePluginSynthARA.vst3 \
            CabbagePluginEffectARA/CabbagePluginEffectARA_assets/Release/CabbagePluginEffectARA.vst3 \
            CabbagePluginSynthAUv2/CabbagePluginSynthAUv2_assets/Release/CabbagePluginSynthAUv2.component \
            CabbagePluginEffectAUv2/CabbagePluginEffectAUv2_assets/Release/CabbagePluginEffectAUv2.component \
            CabbageApp/Release/CabbageApp


      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with: 
          name: CabbageBundle-macos
          path: build/CabbageBundle.zip

  linux_build:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v1
        with:
          fetch-depth: 1
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev libxext-dev \
            libasound2-dev libjack-jackd2-dev libpulse-dev

      - name: Install build-essential
        run: sudo apt-get update && sudo apt-get install -y build-essential
        
        
      - name: Build and install Csound
        run: |
          sudo apt-get install -y \
            libsndfile1-dev libportaudio2 portaudio19-dev libportmidi-dev \
            libpulse-dev swig liblua5.1-0-dev default-jdk \
            libfluidsynth-dev liblo-dev fluid \
            ladspa-sdk libpng-dev dssi-dev libgmm++-dev \
            bison flex libportsmf-dev libeigen3-dev libcunit1-dev \
            gettext libsamplerate0-dev
          git clone --depth 1 --branch ${{ env.CSOUND_TAG }} \
            https://github.com/csound/csound.git csound-src
          cmake -G "Unix Makefiles" -B csound-src/build -S csound-src \
            -DINSTALL_PYTHON_INTERFACE=OFF
          cd csound-src/build
          make
          sudo make install

      - name: Checkout vscabbage (widget sources for tests)
        uses: actions/checkout@v1
        with:
          repository: rorywalsh/vscabbage
          ref: develop
          path: vscabbage
          fetch-depth: 1

      - name: Configure tests
        # The vscabbage checkout location varies by runner/action version, so
        # resolve it dynamically and fail fast when the widget sources are
        # missing — otherwise tests run against the backend placeholder and
        # segfault on missing widgets instead of failing cleanly.
        run: |
          WS="${{ github.workspace }}"
          if [ -d "$WS/vscabbage/src/cabbage/widgets" ]; then VSCABBAGE_SRC="$WS/vscabbage/src";
          elif [ -d "$WS/../vscabbage/src/cabbage/widgets" ]; then VSCABBAGE_SRC="$WS/../vscabbage/src";
          else echo "::error::vscabbage widget sources not found under $WS"; exit 1; fi
          echo "Using vscabbage sources: $VSCABBAGE_SRC"
          cmake -G "Unix Makefiles" -B build-tests -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCABBAGE_BUILD_TARGET=CabbageTests \
            -DTEST_VSCABBAGE_DIR="$VSCABBAGE_SRC" \
            -DCMAKE_C_COMPILER=$(which gcc) \
            -DCMAKE_CXX_COMPILER=$(which g++)

      - name: Build tests
        timeout-minutes: 30
        run: cmake --build build-tests

      - name: Run unit tests (incl. stdin onFileChanged resave tests)
        # Each Catch2 TEST_CASE is its own ctest test (see
        # catch_discover_tests in CMakeLists): progress streams per case and
        # --timeout turns a hung case into a reported Timeout while the rest
        # still run.
        timeout-minutes: 15
        run: timeout 600 ctest --test-dir build-tests --output-on-failure --timeout 180

      - name: Rerun suite under gdb for a symbolicated backtrace
        # Runs only when the suite above fails. Zero cost on green runs.
        # The tests build uses RelWithDebInfo so the trace has line numbers.
        if: failure()
        run: |
          command -v gdb || sudo apt-get install -y gdb
          gdb --batch --ex run --ex "bt 30" --ex "info threads" --args ./build-tests/CabbageTests 2>&1 | tail -60

      - name: Configure CMake
        run: |
          cmake -G "Unix Makefiles" -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_ALL_TARGETS=ON \
            -DCMAKE_C_COMPILER=$(which gcc) \
            -DCMAKE_CXX_COMPILER=$(which g++)

      - name: Zip Linux artifacts
        run: |
          cd build
          zip -r CabbageBundle.zip \
            CabbagePluginEffect/CabbagePluginEffect_assets/CabbagePluginEffect.vst3 \
            CabbagePluginSynth/CabbagePluginSynth_assets/CabbagePluginSynth.vst3 \
            CabbagePluginEffectARA/CabbagePluginEffectARA_assets/CabbagePluginEffectARA.vst3 \
            CabbagePluginSynthARA/CabbagePluginSynthARA_assets/CabbagePluginSynthARA.vst3 \
            CabbageApp/CabbageApp

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: CabbageBundle-linux
          path: build/CabbageBundle.zip

  windows_build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v1
        with:
          fetch-depth: 1
          submodules: true

      - name: Download and Extract Csound
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/csound/csound/releases/download/${{ env.CSOUND_TAG }}/csound-windows-${{ env.CSOUND_TAG }}.zip" -OutFile "csound7.zip"
          Expand-Archive -Path "csound7.zip" -DestinationPath "csound7" -Force

          Write-Host "Contents of csound7 (for debug):"
          Get-ChildItem -Path "csound7" -Recurse | ForEach-Object { Write-Host $_.FullName }

          # Prefer an x86_64 installer if present, otherwise take first .exe
          $exe = Get-ChildItem -Path "csound7" -Recurse -Filter "*windows*x86*64*.exe" -File | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path "csound7" -Recurse -Filter "*.exe" -File | Select-Object -First 1
          }

          if (-not $exe) {
            Write-Error "No .exe installer found in csound7 folder!"
            exit 1
          }

          Write-Host "Found installer: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination ".\csound-7.exe" -Force

      - name: Install Csound
        shell: pwsh
        run: |
          Start-Process -FilePath ".\csound-7.exe" -ArgumentList "/VERYSILENT" -Wait -Verb RunAs

      - name: Put Csound DLL location on PATH
        # The test executable (and discovery run at build time) loads
        # csound7_64.dll at startup; without its directory on PATH Windows
        # fails with 0xC0000135 STATUS_DLL_NOT_FOUND. Applies to all later
        # steps via GITHUB_PATH.
        shell: pwsh
        run: |
          Write-Host "Csound libraries found:"
          Get-ChildItem -Path "C:\Program Files\Csound7" -Recurse -Filter "*.lib" -File | Select-Object -ExpandProperty FullName
          $dll = Get-ChildItem -Path "C:\Program Files\Csound7" -Recurse -File | Where-Object { $_.Name -in @("csound7_64.dll", "csound64.dll") } | Select-Object -First 1
          if (-not $dll) { Write-Error "Neither csound7_64.dll nor csound64.dll found under C:\Program Files\Csound7"; exit 1 }
          Write-Host "Found $($dll.FullName)"
          $dll.DirectoryName >> $env:GITHUB_PATH

      - name: Checkout vscabbage (widget sources for tests)
        uses: actions/checkout@v1
        with:
          repository: rorywalsh/vscabbage
          ref: develop
          path: vscabbage
          fetch-depth: 1

      - name: Configure tests
        # The vscabbage checkout location varies by runner/action version, so
        # resolve it dynamically and fail fast when the widget sources are
        # missing — otherwise tests run against the backend placeholder and
        # segfault on missing widgets instead of failing cleanly.
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          $vsrc = @("$ws/vscabbage/src", "$ws/../vscabbage/src") | Where-Object { Test-Path "$_/cabbage/widgets" } | Select-Object -First 1
          if (-not $vsrc) { Write-Error "vscabbage widget sources not found under $ws"; exit 1 }
          Write-Host "Using vscabbage sources: $vsrc"
          cmake -S . -B build-tests -DCABBAGE_BUILD_TARGET=CabbageTests -DTEST_VSCABBAGE_DIR="$vsrc" -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        # RelWithDebInfo (not Release) so a debugger backtrace has symbols.
        shell: pwsh
        run: cmake --build build-tests --config RelWithDebInfo

      - name: Run unit tests (incl. stdin onFileChanged resave tests)
        # Each Catch2 TEST_CASE is its own ctest test (see
        # catch_discover_tests in CMakeLists): progress streams per case and
        # --timeout turns a hung case into a reported Timeout while the rest
        # still run.
        timeout-minutes: 15
        shell: pwsh
        run: ctest --test-dir build-tests -C RelWithDebInfo --output-on-failure --timeout 180

      - name: Rerun suite under cdb for a Windows backtrace
        # Runs only when earlier steps failed. Zero cost on green runs.
        # Needs the PDBs from the RelWithDebInfo tests build above.
        if: failure()
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = ".\build-tests\RelWithDebInfo\CabbageTests.exe"
          if (-not (Test-Path $exe)) { Write-Warning "Test binary not found, skipping backtrace"; exit 0 }
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { Write-Warning "cdb not found, skipping backtrace"; exit 0 }
          & $cdb -c ".symfix+ C:\symcache;g;k100;q" $exe 2>&1 | Select-Object -Last 60

      - name: Configure build
        shell: cmd
        run: |
          cmake -S . -B build -DBUILD_ALL_TARGETS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Zip the Windows app artifacts
        shell: pwsh
        run: |
          cd build
          Compress-Archive -Path @(
            "CabbagePluginEffect/CabbagePluginEffect_assets/VST3/Release/CabbagePluginEffect.vst3",
            "CabbagePluginSynth/CabbagePluginSynth_assets/VST3/Release/CabbagePluginSynth.vst3",
            "CabbagePluginEffectARA/CabbagePluginEffectARA_assets/VST3/Release/CabbagePluginEffectARA.vst3",
            "CabbagePluginSynthARA/CabbagePluginSynthARA_assets/VST3/Release/CabbagePluginSynthARA.vst3",
            "CabbageApp/Release/CabbageApp.exe"
          ) -DestinationPath CabbageBundle.zip

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CabbageBundle-windows
          path: build\CabbageBundle.zip

  windows_arm_build:
    name: Windows ARM build
    runs-on: windows-11-arm
    steps:
      - name: Checkout source code
        uses: actions/checkout@v1
        with:
          fetch-depth: 1
          submodules: true

      - name: Download and Extract Csound
        shell: pwsh
        run: |
          # Csound ships a dedicated Windows ARM64 installer
          Invoke-WebRequest -Uri "https://github.com/csound/csound/releases/download/${{ env.CSOUND_TAG }}/csound-windows-arm64-installer-${{ env.CSOUND_TAG }}.zip" -OutFile "csound7-arm.zip"
          Expand-Archive -Path "csound7-arm.zip" -DestinationPath "csound7-arm" -Force

          Write-Host "Contents of csound7-arm (for debug):"
          Get-ChildItem -Path "csound7-arm" -Recurse | ForEach-Object { Write-Host $_.FullName }

          # The ARM64 installer zip contains a single .exe installer
          $exe = Get-ChildItem -Path "csound7-arm" -Recurse -Filter "*.exe" -File | Select-Object -First 1

          if (-not $exe) {
            Write-Error "No .exe installer found in csound7-arm folder!"
            exit 1
          }

          Write-Host "Found installer: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination ".\csound-7-arm.exe" -Force

      - name: Install Csound
        shell: pwsh
        run: |
          Start-Process -FilePath ".\csound-7-arm.exe" -ArgumentList '/VERYSILENT /DIR="C:\Program Files\Csound7"' -Wait -Verb RunAs

      - name: Wait for Installation to Complete
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5

      - name: Verify Csound
        shell: pwsh
        run: |
          # Csound 7.0.0's Windows package was rebuilt with USE_LIB64 and
          # "csound7_64" library names. Older installers used lib\csound64.
          # Accept both layouts so an upstream repackage doesn't break this job.
          $root = "C:\Program Files\Csound7"
          if (-not (Test-Path $root)) {
            Write-Error "Csound is not installed at $root"
            exit 1
          }

          Get-ChildItem $root
          Get-ChildItem (Join-Path $root "bin") -ErrorAction SilentlyContinue
          Get-ChildItem (Join-Path $root "lib") -ErrorAction SilentlyContinue
          Get-ChildItem (Join-Path $root "include\csound") -ErrorAction SilentlyContinue

          $dll = Get-ChildItem -Path $root -Recurse -File |
            Where-Object { $_.Name -in @("csound7_64.dll", "csound64.dll") } |
            Select-Object -First 1
          if (-not $dll) {
            Write-Error "No Csound DLL found under $root"
            exit 1
          }

          $lib = Get-ChildItem -Path $root -Recurse -File |
            Where-Object { $_.Name -in @("csound7_64.lib", "libcsound7_64.lib", "csound64.lib", "libcsound64.lib") } |
            Select-Object -First 1
          if (-not $lib) {
            Write-Error "No Csound import library found under $root"
            exit 1
          }

          Write-Host "Found Csound DLL: $($dll.FullName)"
          Write-Host "Found Csound import library: $($lib.FullName)"

      - name: Put Csound DLL location on PATH
        # The test executable (and discovery run at build time) loads
        # csound7_64.dll at startup; without its directory on PATH Windows
        # fails with 0xC0000135 STATUS_DLL_NOT_FOUND. Applies to all later
        # steps via GITHUB_PATH.
        shell: pwsh
        run: |
          Write-Host "Csound libraries found:"
          Get-ChildItem -Path "C:\Program Files\Csound7" -Recurse -Filter "*.lib" -File | Select-Object -ExpandProperty FullName
          $dll = Get-ChildItem -Path "C:\Program Files\Csound7" -Recurse -File | Where-Object { $_.Name -in @("csound7_64.dll", "csound64.dll") } | Select-Object -First 1
          if (-not $dll) { Write-Error "Neither csound7_64.dll nor csound64.dll found under C:\Program Files\Csound7"; exit 1 }
          Write-Host "Found $($dll.FullName)"
          $dll.DirectoryName >> $env:GITHUB_PATH

      - name: Checkout vscabbage (widget sources for tests)
        uses: actions/checkout@v1
        with:
          repository: rorywalsh/vscabbage
          ref: develop
          path: vscabbage
          fetch-depth: 1

      - name: Configure tests
        # The vscabbage checkout location varies by runner/action version, so
        # resolve it dynamically and fail fast when the widget sources are
        # missing — otherwise tests run against the backend placeholder and
        # segfault on missing widgets instead of failing cleanly.
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          $vsrc = @("$ws/vscabbage/src", "$ws/../vscabbage/src") | Where-Object { Test-Path "$_/cabbage/widgets" } | Select-Object -First 1
          if (-not $vsrc) { Write-Error "vscabbage widget sources not found under $ws"; exit 1 }
          Write-Host "Using vscabbage sources: $vsrc"
          cmake -S . -B build-tests -A ARM64 -DCABBAGE_BUILD_TARGET=CabbageTests -DTEST_VSCABBAGE_DIR="$vsrc" -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        # RelWithDebInfo (not Release) so a debugger backtrace has symbols.
        shell: pwsh
        run: cmake --build build-tests --config RelWithDebInfo

      - name: Run unit tests (incl. stdin onFileChanged resave tests)
        # Each Catch2 TEST_CASE is its own ctest test (see
        # catch_discover_tests in CMakeLists): progress streams per case and
        # --timeout turns a hung case into a reported Timeout while the rest
        # still run.
        timeout-minutes: 15
        shell: pwsh
        run: ctest --test-dir build-tests -C RelWithDebInfo --output-on-failure --timeout 180

      - name: Rerun suite under cdb for a Windows backtrace
        # Runs only when earlier steps failed. Zero cost on green runs.
        # Needs the PDBs from the RelWithDebInfo tests build above.
        if: failure()
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = ".\build-tests\RelWithDebInfo\CabbageTests.exe"
          if (-not (Test-Path $exe)) { Write-Warning "Test binary not found, skipping backtrace"; exit 0 }
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64\cdb.exe"
          if (-not (Test-Path $cdb)) { $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" }
          if (-not (Test-Path $cdb)) { Write-Warning "cdb not found, skipping backtrace"; exit 0 }
          & $cdb -c ".symfix+ C:\symcache;g;k100;q" $exe 2>&1 | Select-Object -Last 60

      - name: Configure build
        shell: cmd
        run: |
          cmake -S . -B build -A ARM64 -DBUILD_ALL_TARGETS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Verify ARM64 VST3 bundle layout
        shell: pwsh
        run: |
          foreach ($n in "CabbagePluginEffect","CabbagePluginSynth") {
            $b = "build/$n/${n}_assets/VST3/Release/$n.vst3"
            Get-ChildItem $b -Recurse | ForEach-Object { Write-Host $_.FullName }
            $bin = Get-ChildItem "$b/Contents" -Recurse -Filter "$n.vst3" -File | Select-Object -First 1
            if (-not $bin) { Write-Error "No binary in $b"; exit 1 }
            if ($bin.Directory.Name -ne "arm64-win") { Write-Error "Wrong arch folder: $($bin.Directory.Name)"; exit 1 }
            $fs = [IO.File]::OpenRead($bin.FullName); $br = New-Object IO.BinaryReader($fs)
            $fs.Position = 0x3C; $pe = $br.ReadInt32(); $fs.Position = $pe + 4; $m = $br.ReadUInt16(); $fs.Close()
            Write-Host "$n machine = 0x$($m.ToString('X'))"
            if ($m -ne 0xAA64) { Write-Error "$n is not ARM64"; exit 1 }
          }

      - name: Zip the Windows app artifacts
        shell: pwsh
        run: |
          cd build
          Compress-Archive -Path @(
            "CabbagePluginEffect/CabbagePluginEffect_assets/VST3/Release/CabbagePluginEffect.vst3",
            "CabbagePluginSynth/CabbagePluginSynth_assets/VST3/Release/CabbagePluginSynth.vst3",
            "CabbagePluginEffectARA/CabbagePluginEffectARA_assets/VST3/Release/CabbagePluginEffectARA.vst3",
            "CabbagePluginSynthARA/CabbagePluginSynthARA_assets/VST3/Release/CabbagePluginSynthARA.vst3",
            "CabbageApp/Release/CabbageApp.exe"
          ) -DestinationPath CabbageBundle.zip

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CabbageBundle-windows-arm
          path: build\CabbageBundle.zip


